<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem适配</title>
    <style>
        /* html{
            font-size:20px;
        } */
        .box1{
            width: 200px;
            height: 300px;
            background-color: purple;
            margin:30px;
        }
        .box2{
            width: 5rem;
            height: 3rem;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <script>
        function resetHTMLFontsize(){
            document.documentElement.style.fontSize=screen.width/10+'px';

        }

        resetHTMLFontsize();
        window.onresize=resetHTMLFontsize;
    </script>
</body>
</html>
