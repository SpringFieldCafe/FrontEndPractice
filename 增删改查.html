<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>增删改查</title>
    <style>
        table{
          width: 100%;
          border-collapse:collapse;
          margin-top:20px;
        }
        th,td{
            border:1px solid #DDDDDD;
            text-align:center;
            padding: auto;
        }
        th{
            background-color: #DDDDDD;
        }
        button{
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">增删改查</h1>
    <button onclick="addROW()">添加</button>
    <table id="table">
        <tr>
            <th>姓名</th>
            <th>联系方式</th>
            <th>操作</th>
        </tr>
        <tr>
            <td>张三</td>
            <td>1234567890</td>
            <td><button onclick="deleteRow(this)">删除</button><button onclick="changeRow(this)">修改</button></td>
        </tr>
    </table>
    <script src="./JS/table.js"></script>
</body>
</html>
