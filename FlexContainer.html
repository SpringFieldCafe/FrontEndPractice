<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 盒子</title>
    <style>
        html{
            font-size:10px;
        }
        .container{
            display:flex;
            height: 40rem;
            background-color:aqua;
            /* flex-direction: column;
            flex-wrap:wrap-reverse; */
            justify-content:space-around;
        }
        .item{
            width: 10rem;
            font-size:8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" style="background-color: yellow";>1</div>
        <div class="item" style="background-color: blue;";>2</div>
        <div class="item" style="background-color: blueviolet;">3</div>
        <div class="item" style="background-color: #777;">4</div>
        <div class="item" style="background-color: #999999;">5</div>
        <div class="item" style="background-color: #456789;">6</div>
    </div>
</body>
</html>
