<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS基础语法</title>
</head>
<body>
    <script>
        var x;
        let y=10;
        const PI=3.14;
        console.log(x,y,PI);
        let name="张三";
        console.log(name);
        let emptyString=null;
        console.log(emptyString);
        let age=18;
        if(age>=18){
            console.log("成年人");
        }else{
            console.log("未成年人");
        }

        let time=12;
        if (time<12){
            console.log("good morning");
        }
        for(var i=0;i<5;){
            console.log(i++);
        }
        function hello(){
            console.log('hello world');
        }

        hello();
       
    </script>
</body>
</html>
