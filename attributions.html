<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            background-color: aqua;
            width:150px;
            height:100px;
        }
        .inline{
            background-color: royalblue;
        }
        .inline-block{
            width:100px;
        }
        .div-inline{
            display: inline;
            background-color: salmon;
        }
        .span-inline{
            display:inline-block;
            background-color:blueviolet;
            width:300px;
        }
        .none{
            display:none;
        }
    </style>
</head>
<body>
    <h1 style="font: bolder 50px 'KaiTi'">
        南本半节课
    </h1>
    <p style="line-height:40px">zhehehehehehhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh</p>
    <div class="block">
        这是一个块级元素
    </div>
     <div class="block">
        这是一个块级元素
    </div>
     <div class="block">
        这是一个块级元素
    </div>
    <span class="inline">这是一个行内元素</span>
    <img src="./需求分析方正系统架构图.png" alt="" class="inline-block">
    <img src="./需求分析方正系统架构图.png" alt="" class="inline-block">
    <img src="./需求分析方正系统架构图.png" alt="" class="inline-block">

    <h2>display</h2>
    <div class="div-inline">这是一个转换成inline元素的div</div>
    <span class="span-inline">这是一个转换成inline-block元素的span</span>
    <span class="none">这是一个display:none的span</span>
</body>
</html>
