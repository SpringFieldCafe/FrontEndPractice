<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>locate</title>
    <style>
        .box1{
            background-color: violet;
            height: 400px;
        }
        .box-normal{
            width: 100px;
            height: 100px;
            background-color:brown;
        }
        .relative{
            width: 120px;
            height: 120px;
            background-color: yellow;
            position:relative;
            left:40px;
            top:50px;
        }
        .absolute{
            width: 120px;
            height: 120px;
            background-color: aquamarine;
            position:absolute;
            margin-bottom: 400px;
            left:200px;
        }
        .box-fixed{
            background-color: palegreen;
            width: 200px;
            height: 100px;
            position:fixed;
            right:0;
            top:300px;
        }
    </style>
</head>
<body>
    <h1>relative location</h1>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="relative"></div>
        <div class="box-normal"></div>
    </div>
    <h1>absolute location</h1>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="absolute"></div>
        <div class="box-normal"> </div>
    </div>
    <h1>fixed location</h1>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="box-fixed"></div>
        <div class="box-normal"></div>
    </div>
</body>
</html>
